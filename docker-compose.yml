services:
  db:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: localhost        # hardening: root không đăng nhập từ xa
      MYSQL_DATABASE: ${WP_DB_NAME}
      MYSQL_USER: ${WP_DB_USER}         # chỉ có quyền trên DB wordpress
      MYSQL_PASSWORD: ${WP_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6-apache
    container_name: wordpress
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://' . $$_SERVER['HTTP_HOST']);
        define('WP_SITEURL', 'https://' . $$_SERVER['HTTP_HOST']);
        define('DISALLOW_FILE_EDIT', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
    volumes:
      - wp_data:/var/www/html
    networks: [backend, frontend]
    security_opt: ["no-new-privileges:true"]

  phpmyadmin:
    image: phpmyadmin:5
    container_name: phpmyadmin
    restart: unless-stopped
    depends_on: [db]
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8081:80"             # chỉ truy cập từ máy local
    networks: [backend, frontend]
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine   # chạy non-root
    container_name: nginx
    restart: unless-stopped
    depends_on: [wordpress]
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [frontend]

networks:
  frontend:
  backend:
    internal: true       # DB không ra được Internet, không bị truy cập từ ngoài

volumes:
  db_data:
  wp_data:
